<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>360 Live Demo — ควบคุมสตรีมกล้อง 360</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --panel-2: #17202b;
    --line: #263340;
    --text: #dbe6f0;
    --text-dim: #7f93a6;
    --accent: #35c4d6;
    --accent-2: #f2a541;
    --live: #4fd67a;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }

  #viewer { position: fixed; inset: 0; }
  #viewer canvas { display: block; }

  .hud {
    position: fixed; z-index: 10; pointer-events: none;
  }
  .topbar {
    top: 0; left: 0; right: 0; padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, rgba(11,15,20,0.85), rgba(11,15,20,0));
  }
  .brand { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px var(--live); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .brand .title { font-weight: 600; letter-spacing: 0.02em; font-size: 15px; }
  .brand .sub { color: var(--text-dim); font-size: 12px; font-family: var(--mono); }

  .status-chip {
    pointer-events: auto;
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 6px 12px; display: flex; align-items: center; gap: 8px;
  }
  .status-chip b { color: var(--accent); font-weight: 600; }

  .panel {
    pointer-events: auto;
    position: fixed; left: 14px; bottom: 14px; width: 340px; max-width: calc(100vw - 28px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; font-size: 13px; z-index: 20;
    max-height: 60vh; overflow-y: auto;
  }
  .panel h2 {
    margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); font-weight: 600;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .row label { width: 62px; flex-shrink: 0; color: var(--text-dim); font-family: var(--mono); font-size: 11px; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row .val { width: 42px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--accent); }

  .mode-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .mode-tabs button {
    flex: 1; padding: 7px 4px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text-dim); font-family: var(--mono); font-size: 11px; cursor: pointer;
  }
  .mode-tabs button.active { background: rgba(53,196,214,0.14); border-color: var(--accent); color: var(--accent); }

  .btn {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--accent);
    background: rgba(53,196,214,0.12); color: var(--accent); font-family: var(--mono); font-size: 12px;
    cursor: pointer; margin-top: 4px;
  }
  .btn:hover { background: rgba(53,196,214,0.22); }
  .btn.secondary { border-color: var(--line); background: var(--panel-2); color: var(--text-dim); }

  .snapshot-preview {
    margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    display: none;
  }
  .snapshot-preview img { display: block; width: 100%; }
  .snapshot-preview .cap { padding: 6px 8px; font-family: var(--mono); font-size: 10px; color: var(--text-dim); background: var(--panel-2); }

  #vrBtnHost { position: fixed; bottom: 14px; right: 14px; z-index: 20; pointer-events: auto; }
  #vrBtnHost button {
    font-family: var(--mono) !important; font-size: 12px !important; letter-spacing: 0.04em;
    background: var(--accent-2) !important; color: #1a1200 !important; border: none !important;
    border-radius: 8px !important; padding: 12px 22px !important; font-weight: 700 !important;
  }

  .toggle-panel { position: fixed; left: 14px; bottom: 14px; z-index: 21; pointer-events: auto; display:none; }
  .toggle-panel button {
    background: var(--panel); border: 1px solid var(--line); color: var(--text-dim);
    border-radius: 8px; padding: 8px 12px; font-family: var(--mono); font-size: 11px; cursor: pointer;
  }

  @media (max-width: 480px) {
    .panel { width: calc(100vw - 28px); }
    .brand .sub { display: none; }
  }
</style>
</head>
<body>

<div id="viewer"></div>

<div class="hud topbar">
  <div class="brand">
    <span class="dot"></span>
    <div>
      <div class="title">360° LIVE — Demo Feed</div>
      <div class="sub">simulated equirectangular source · 2048×1024</div>
    </div>
  </div>
  <div class="status-chip" id="statusChip">connecting…</div>
</div>

<div class="panel" id="panel">
  <h2>มุมมองหลัก (3D Sphere)</h2>
  <div class="mode-tabs">
    <button id="tabFull" class="active">360°</button>
    <button id="tab180">180°</button>
  </div>

  <h2 style="margin-top:14px">ทดสอบ API ดึงมุมมอง (Viewport Request)</h2>
  <div class="row"><label>Yaw</label><input type="range" id="yawSlider" min="-180" max="180" value="0"><span class="val" id="yawVal">0°</span></div>
  <div class="row"><label>Pitch</label><input type="range" id="pitchSlider" min="-89" max="89" value="0"><span class="val" id="pitchVal">0°</span></div>
  <div class="row"><label>FOV</label><input type="range" id="fovSlider" min="30" max="150" value="90"><span class="val" id="fovVal">90°</span></div>
  <button class="btn" id="fetchBtn">GET /api/frame/viewport.png</button>
  <button class="btn secondary" id="fetchHemiBtn">GET /api/frame/hemisphere.png (180°)</button>

  <div class="snapshot-preview" id="snapshotBox">
    <img id="snapshotImg" alt="viewport snapshot" />
    <div class="cap" id="snapshotCap">—</div>
  </div>
</div>

<div class="toggle-panel" id="togglePanel"><button id="showPanelBtn">แสดงแผงควบคุม</button></div>

<div id="vrBtnHost"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const API = {
  status: '/api/status',
  full: (w, h) => `/api/frame/full.png?width=${w}&height=${h}&t=${Date.now()}`,
  hemisphere: (yaw, fov, w, h) => `/api/frame/hemisphere.png?yaw=${yaw}&fov=${fov}&width=${w}&height=${h}&t=${Date.now()}`,
  viewport: (yaw, pitch, fov, w, h) => `/api/frame/viewport.png?yaw=${yaw}&pitch=${pitch}&fov=${fov}&width=${w}&height=${h}&t=${Date.now()}`
};

// ---------- Three.js scene ----------
const container = document.getElementById('viewer');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 0.01);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
container.appendChild(renderer.domElement);

document.getElementById('vrBtnHost').appendChild(VRButton.createButton(renderer));

// Desktop / non-VR look-around
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableZoom = false;
controls.enablePan = false;
controls.rotateSpeed = -0.35;
controls.target.set(0, 0, -0.01);

let currentMode = 'full'; // 'full' (360) | 'hemi' (180)
const textureLoader = new THREE.TextureLoader();
let sphereFull, sphereHemi;

function makeSphere(phiLength) {
  // radius large & inverted (viewed from inside)
  const geo = new THREE.SphereGeometry(50, 64, 40, 0, phiLength);
  geo.scale(-1, 1, 1);
  const mat = new THREE.MeshBasicMaterial({ color: 0x222222 });
  const mesh = new THREE.Mesh(geo, mat);
  // rotate so the visible slice faces the user by default
  mesh.rotation.y = -phiLength / 2;
  return mesh;
}
sphereFull = makeSphere(Math.PI * 2);
sphereHemi = makeSphere(Math.PI); // 180° wedge
sphereHemi.visible = false;
scene.add(sphereFull, sphereHemi);

function applyTexture(mesh, url) {
  textureLoader.load(url, (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.minFilter = THREE.LinearFilter;
    if (mesh.material.map) mesh.material.map.dispose();
    mesh.material.map = tex;
    mesh.material.color.set(0xffffff); // stop tinting the texture with the dark placeholder color
    mesh.material.needsUpdate = true;
  });
}

const statusChip = document.getElementById('statusChip');

async function refreshLiveTexture() {
  try {
    if (currentMode === 'full') {
      applyTexture(sphereFull, API.full(2048, 1024));
    } else {
      applyTexture(sphereHemi, API.hemisphere(0, 180, 1600, 1600));
    }
    const s = await fetch(API.status).then(r => r.json());
    const label = s.sourceUsingRealCamera ? 'REAL CAMERA' : (s.sourceUsingStaticScene ? 'STATIC SCENE' : 'SIMULATED');
    statusChip.innerHTML = `<b>${label}</b> · ${s.sourceResolution.width}×${s.sourceResolution.height}`;
  } catch (e) {
    statusChip.textContent = 'server unreachable';
  }
}
refreshLiveTexture();
setInterval(refreshLiveTexture, 1500); // poll for "live" updates

function setMode(mode) {
  currentMode = mode;
  sphereFull.visible = mode === 'full';
  sphereHemi.visible = mode === 'hemi';
  document.getElementById('tabFull').classList.toggle('active', mode === 'full');
  document.getElementById('tab180').classList.toggle('active', mode === 'hemi');
  refreshLiveTexture();
}
document.getElementById('tabFull').onclick = () => setMode('full');
document.getElementById('tab180').onclick = () => setMode('hemi');

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

// ---------- Manual viewport API test panel ----------
const yawSlider = document.getElementById('yawSlider');
const pitchSlider = document.getElementById('pitchSlider');
const fovSlider = document.getElementById('fovSlider');
const yawVal = document.getElementById('yawVal');
const pitchVal = document.getElementById('pitchVal');
const fovVal = document.getElementById('fovVal');
[yawSlider, pitchSlider, fovSlider].forEach(s => s.addEventListener('input', () => {
  yawVal.textContent = yawSlider.value + '°';
  pitchVal.textContent = pitchSlider.value + '°';
  fovVal.textContent = fovSlider.value + '°';
}));

const snapshotBox = document.getElementById('snapshotBox');
const snapshotImg = document.getElementById('snapshotImg');
const snapshotCap = document.getElementById('snapshotCap');

document.getElementById('fetchBtn').onclick = () => {
  const yaw = yawSlider.value, pitch = pitchSlider.value, fov = fovSlider.value;
  const url = API.viewport(yaw, pitch, fov, 640, 360);
  snapshotImg.src = url;
  snapshotCap.textContent = `viewport.png  yaw=${yaw}° pitch=${pitch}° fov=${fov}°`;
  snapshotBox.style.display = 'block';
};
document.getElementById('fetchHemiBtn').onclick = () => {
  const yaw = yawSlider.value;
  const url = API.hemisphere(yaw, 180, 800, 800);
  snapshotImg.src = url;
  snapshotCap.textContent = `hemisphere.png  yaw=${yaw}° fov=180°`;
  snapshotBox.style.display = 'block';
};

// Hide the flat panel while in VR (it's a 2D overlay, meaningless in-headset)
renderer.xr.addEventListener('sessionstart', () => {
  document.getElementById('panel').style.display = 'none';
  document.getElementById('togglePanel').style.display = 'none';
});
renderer.xr.addEventListener('sessionend', () => {
  document.getElementById('panel').style.display = 'block';
});

document.getElementById('showPanelBtn').onclick = () => {
  document.getElementById('panel').style.display = 'block';
  document.getElementById('togglePanel').style.display = 'none';
};
</script>
</body>
</html>
