; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  ESP32Servo
  bblanchon/ArduinoJson

; Standalone LED / servo / stepper test (hwtest/hwtest.cpp): uncomment this env, then run
; pio run -e hwtest -t upload
; [env:hwtest]
; platform = espressif32
; board = esp32dev
; framework = arduino
; monitor_speed = 115200
; lib_deps =
;   ESP32Servo
; build_src_filter = -<*> +<../hwtest/hwtest.cpp>

; Alternate reject actuator (Option B): 5V relay + solenoid/air valve.
; Enabling this build maps ServoAngle actions onto the relay output instead.
; build_flags =
;   -D ACTUATOR_RELAY