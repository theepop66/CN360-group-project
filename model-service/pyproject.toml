[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cn360-model-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "Pillow>=11,<13"]

[project.optional-dependencies]
test = ["httpx>=0.28,<0.29", "pytest>=8,<10", "pytest-asyncio>=1,<2", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["cn360_model"]

[tool.setuptools.packages.find]
include = ["cn360_model*"]
