<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07110f" />
  <title>VisionQC · WebRTC Camera</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #07110f; color: #eafff5; padding: 16px; }
    h1 { font-size: 1.2rem; margin-bottom: 12px; color: #68efb3; }
    video { width: 100%; max-height: 50vh; border-radius: 8px; background: #0d1f1a; }
    .controls { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 1rem;
             font-weight: 600; cursor: pointer; }
    #start { background: #68efb3; color: #07110f; }
    #start:disabled { opacity: 0.4; }
    #stop { background: #3a2020; color: #ff8888; }
    #stop:disabled { opacity: 0.3; }
    #status { margin-top: 12px; padding: 8px; border-radius: 6px; background: #0d1f1a;
              font-size: 0.9rem; min-height: 2.4em; }
    .hint { margin-top: 16px; font-size: 0.8rem; color: #5a8a7a; }
  </style>
</head>
<body>
  <h1>WebRTC Camera Sender</h1>
  <video id="preview" autoplay muted playsinline></video>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <p id="status">กดปุ่ม Start เพื่อเริ่มส่งภาพผ่าน WebRTC</p>
  <p class="hint">เปิดหน้านี้บน iPhone แล้วกด Start · ฝั่ง VR เปิด HUD ด้วย <code>?camera=webrtc</code></p>
  <script type="module">
    import { createWebRtcSender } from "./js/webrtc-camera.js";

    const video = document.querySelector("#preview");
    const startBtn = document.querySelector("#start");
    const stopBtn = document.querySelector("#stop");
    const statusEl = document.querySelector("#status");
    let sender = null;
    let media = null;

    function setStatus(text) { statusEl.textContent = text; }

    async function start() {
      startBtn.disabled = true;
      stopBtn.disabled = false;
      setStatus("กำลังขอใช้กล้อง…");
      try {
        media = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = media;
        await video.play();
        sender = createWebRtcSender(media);
        sender.start((state) => {
          const labels = {
            "connected-to-signal": "เชื่อมต่อ signaling แล้ว · รอ VR headset…",
            "signal-disconnected": "signaling ขาด · กำลังเชื่อมต่อใหม่…",
            "connected": "WebRTC เชื่อมต่อสำเร็จ · กำลังส่งภาพ",
            "connecting": "กำลังเชื่อมต่อ WebRTC…",
            "failed": "การเชื่อมต่อล้มเหลว",
            "disconnected": "ขาดการเชื่อมต่อ"
          };
          setStatus(labels[state] ?? state);
        });
      } catch (error) {
        setStatus(`ใช้กล้องไม่ได้: ${error.message}`);
        stop();
      }
    }

    function stop() {
      sender?.stop(); sender = null;
      media?.getTracks().forEach(t => t.stop()); media = null;
      video.srcObject = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus("หยุดส่งภาพแล้ว");
    }

    startBtn.addEventListener("click", start);
    stopBtn.addEventListener("click", stop);
    document.addEventListener("visibilitychange", () => { if (document.hidden && sender) stop(); });
    window.addEventListener("pagehide", stop);
  </script>
</body>
</html>
