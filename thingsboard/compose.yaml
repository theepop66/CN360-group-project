name: cn360-monitoring
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: ${CN360_TB_DB_PASSWORD:?Run the setup script first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d thingsboard"]
      interval: 5s
      timeout: 3s
      retries: 30
  thingsboard:
    image: thingsboard/tb-node:4.3.1.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:8080"
    environment:
      TB_SERVICE_ID: cn360-monitoring
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_PASSWORD: ${CN360_TB_DB_PASSWORD:?Run the setup script first}
      TB_QUEUE_TYPE: in-memory
      JAVA_OPTS: "-Xms256m -Xmx1024m"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
volumes:
  postgres-data:
